services:

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: advanced-multisource-rag-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    volumes:
      # Uploaded/raw documents
      - ./data/raw:/app/data/raw

      # Processed data
      - ./data/processed:/app/data/processed

      # Sample documents
      - ./data/sample:/app/data/sample

      # Persistent ChromaDB data
      - ./chroma_data:/app/data/chroma

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3